# Ejecutar desde la raíz del proyecto: docker compose -f docker/docker-compose.yml up -d
services:
  db:
    image: postgres:15-alpine
    container_name: pos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almacen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crear BD para Metabase (antes del esquema principal)
      - ../docs/00_create_metabase_db.sh:/docker-entrypoint-initdb.d/00_create_metabase_db.sh
      # Script de inicialización: esquema + roles + datos base + usuarios (Admin/admin123, Cajero/cajero123)
      - ../docs/almacen_db.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pos_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/almacen_db
    volumes:
      - ../backend/app:/app/app
      - ../backend/requirements.txt:/requirements.txt
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pip install -q -r /requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: pos_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_METABASE_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/.env:/app/.env
    depends_on:
      - backend
    stdin_open: true
    tty: true

  metabase:
    image: metabase/metabase:latest
    container_name: pos_metabase
    ports:
      - "3001:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_db
      - MB_DB_PORT=5432
      - MB_DB_USER=postgres
      - MB_DB_PASS=postgres
      - MB_DB_HOST=db
      - MB_JETTY_PORT=3000
      - JAVA_TIMEZONE=America/Mexico_City
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  metabase-setup:
    image: alpine:3.19
    container_name: pos_metabase_setup
    entrypoint: ["sh", "/scripts/metabase-entrypoint.sh"]
    depends_on:
      metabase:
        condition: service_healthy
    environment:
      - METABASE_URL=http://metabase:3000
      - METABASE_PUBLIC_URL=http://localhost:3001
      - DB_HOST=db
    volumes:
      - ../scripts:/scripts
      - ../frontend:/frontend
    restart: "no"

volumes:
  postgres_data:
